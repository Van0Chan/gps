name: TrasaGPS
options:
  bundleIdPrefix: sk.trasagps
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TrasaGPS:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - TrasaGPS
    dependencies:
      - target: TrasaGPSTunnel
    entitlements:
      path: TrasaGPS/Resources/TrasaGPS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.trasagps.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TrasaGPS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: TrasaGPS/Device/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/idevice/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/idevice/lib
        OTHER_LDFLAGS: -lidevice_ffi -lresolv -framework Security -framework SystemConfiguration
        SUPPORTED_PLATFORMS: iphoneos
  TrasaGPSTunnel:
    type: app-extension
    platform: iOS
    sources:
      - TrasaGPSTunnel
    entitlements:
      path: TrasaGPSTunnel/TrasaGPSTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.trasagps.app.tunnel
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TrasaGPSTunnel/Info.plist
        SUPPORTED_PLATFORMS: iphoneos
