name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Nový push zruší starší build, ktorý ešte čaká alebo beží.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (iOS 26+ SDK pre Liquid Glass)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Xcode (Liquid Glass needs iOS 26+ SDK)
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          [ "${SDK%%.*}" -ge 26 ] || { echo "Potrebný je iOS 26+ SDK"; exit 1; }

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/idevice/target
          key: idevice-${{ hashFiles('scripts/build-idevice.sh') }}

      - name: Build idevice (Rust) for iOS
        run: scripts/build-idevice.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project TrasaGPS.xcodeproj \
            -scheme TrasaGPS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA (ad-hoc signed)
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/TrasaGPS.app Payload/
          xattr -cr Payload
          # Variant úplne bez podpisu (pre nástroje, ktoré chcú čistú binárku)
          rm -rf unsigned && mkdir -p unsigned/Payload
          cp -R Payload/TrasaGPS.app unsigned/Payload/
          codesign --remove-signature unsigned/Payload/TrasaGPS.app/TrasaGPS || true
          rm -rf unsigned/Payload/TrasaGPS.app/_CodeSignature
          for appex in unsigned/Payload/TrasaGPS.app/PlugIns/*.appex; do
            codesign --remove-signature "$appex/$(basename "$appex" .appex)" || true
            rm -rf "$appex/_CodeSignature"
          done
          (cd unsigned && zip -qr ../GeoPilot-unsigned.ipa Payload)
          # Ad-hoc podpis: TrollStore ho prijme priamo, Sideloadly/AltStore/ESign ho prepíšu vlastným.
          for appex in Payload/TrasaGPS.app/PlugIns/*.appex; do
            codesign --force --sign - --timestamp=none --generate-entitlement-der \
              --entitlements TrasaGPSTunnel/TrasaGPSTunnel.entitlements "$appex"
          done
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements TrasaGPS/Resources/TrasaGPS.entitlements Payload/TrasaGPS.app
          zip -qr GeoPilot.ipa Payload
          ls -lh GeoPilot.ipa

      - name: Verify IPA
        run: |
          echo "== Obsah IPA =="
          unzip -l GeoPilot.ipa | head -40
          echo "== Info.plist =="
          plutil -p Payload/TrasaGPS.app/Info.plist
          echo "== Architektúra =="
          lipo -info Payload/TrasaGPS.app/TrasaGPS
          echo "== Minimálna verzia iOS =="
          otool -l Payload/TrasaGPS.app/TrasaGPS | grep -A4 LC_BUILD_VERSION
          echo "== Rozšírenia =="
          ls Payload/TrasaGPS.app/PlugIns
          codesign -d --entitlements - Payload/TrasaGPS.app/PlugIns/*.appex 2>&1 | tail -8
          echo "== Podpis =="
          codesign -dv Payload/TrasaGPS.app 2>&1
          codesign --verify --verbose Payload/TrasaGPS.app

      - uses: actions/upload-artifact@v4
        with:
          name: GeoPilot-${{ env.VERSION }}
          path: |
            GeoPilot.ipa
            GeoPilot-unsigned.ipa
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Inštalácia

          Stiahni **GeoPilot.ipa** nižšie a nainštaluj ho jedným z týchto spôsobov:

          - **Sideloadly** (Windows/Mac): pripoj iPhone káblom, pretiahni .ipa do Sideloadly, zadaj svoje Apple ID a klikni Start.
            Potom v iPhone: *Nastavenia ▸ Všeobecné ▸ VPN a správa zariadenia* ▸ dôveruj svojmu Apple ID.
            Na iOS 16+ zapni aj *Nastavenia ▸ Súkromie a bezpečnosť ▸ Režim pre vývojárov*.
          - **AltStore / SideStore**: *My Apps ▸ +* a vyber .ipa.
          - **TrollStore**: otvor .ipa v TrollStore a ťukni Install.

          **GeoPilot.ipa** má ad-hoc podpis (funguje s TrollStore aj s podpisovacími nástrojmi).
          **GeoPilot-unsigned.ipa** je úplne bez podpisu – skús ho, ak tvoj nástroj s prvým súborom nefunguje.

          .ipa sa nedá nainštalovať len ťuknutím na súbor v iPhone, musí sa podpísať jedným z nástrojov vyššie.
          Vyžaduje iOS 17.0 alebo novší.
          NOTES
          gh release create "v$VERSION" GeoPilot.ipa GeoPilot-unsigned.ipa \
            --title "GeoPilot $VERSION" \
            --notes-file notes.md \
            --target "${{ github.sha }}"
